<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFB; --band:#EFF1EE; --grid:#DDE0DC; --rule:#C6CAC4;
  --ink:#16191A; --muted:#767C74; --accent:#0B5D51; --accent-soft:#E4EFEB;
  --warn:#9A4A16; --drop:#CFE4DC; --hole:#F6F7F5;
  --up:#0B5D51; --down:#9A4A16;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --row:26px; --phead:24px; --cols:48px 20px 1fr 86px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.4 var(--sans);
  display:flex;flex-direction:column;overflow:hidden}

header{border-bottom:1px solid var(--rule);background:var(--band);flex:0 0 auto}
.bar{display:flex;align-items:stretch;min-height:34px}
.bar+.bar{border-top:1px solid var(--grid)}
.brand{font:600 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);display:flex;align-items:center;padding:0 14px;
  border-right:1px solid var(--grid);white-space:nowrap}
.tabs{display:flex;overflow-x:auto;scrollbar-width:thin}
.tab{font:500 12px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;
  background:none;border:none;border-right:1px solid var(--grid);color:var(--muted);
  padding:0 13px;cursor:pointer;white-space:nowrap}
.tab:hover{background:#E6E9E5;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--accent);
  box-shadow:inset 0 -2px 0 var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.spacer{flex:1}
.meta{display:flex;align-items:center;gap:15px;padding:0 14px;font:400 12px var(--mono);
  color:var(--muted);white-space:nowrap;border-left:1px solid var(--grid)}
.meta b{color:var(--ink);font-weight:500}
.meta .hot{color:var(--warn)}
select,input[type=search]{font:400 12px var(--sans);border:1px solid var(--grid);
  background:var(--paper);color:var(--ink);border-radius:0;padding:4px 6px;height:24px}
select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.ctl{display:flex;align-items:center;gap:7px;padding:0 12px;border-right:1px solid var(--grid)}
.ctl:last-child{border-right:none}
.ctl label{font:500 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{font:500 11px var(--cond);letter-spacing:.09em;text-transform:uppercase;
  background:var(--paper);border:1px solid var(--rule);color:var(--ink);
  padding:5px 10px;cursor:pointer}
.btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.go{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.4;pointer-events:none}

main{flex:1;display:flex;min-height:0}
aside{width:288px;flex:0 0 auto;border-right:1px solid var(--rule);overflow:auto}
aside[hidden]{display:none}
aside.over{box-shadow:inset 0 0 0 2px var(--drop)}
.phead{position:sticky;top:0;z-index:3;height:var(--phead);background:var(--band);
  border-bottom:1px solid var(--rule);padding:0 8px;display:flex;align-items:center;
  gap:8px;font:600 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.phead span{margin-left:auto;font:400 11px var(--mono);color:var(--muted);
  letter-spacing:0;text-transform:none}
.scroller{flex:1;overflow:auto;padding:14px}
.board{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{border:1px solid var(--rule);background:var(--paper)}
.card.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--drop)}
.card>.head{border-bottom:1px solid var(--rule);background:var(--band);
  padding:5px 8px;display:flex;align-items:center;gap:8px;min-height:24px}
.gid{font:600 12px/1 var(--cond);letter-spacing:.1em;color:var(--accent)}
.gsize{font:400 11px var(--mono);color:var(--muted)}
.gsize.full{color:var(--accent)}
.strip{display:flex;flex-wrap:wrap;gap:2px;margin-left:auto;justify-content:flex-end}
.strip img{width:15px;height:11px;object-fit:cover;display:block;box-shadow:0 0 0 .5px rgba(0,0,0,.28)}
.strip img.dup{outline:1.5px solid var(--warn)}

.rows{display:grid;grid-template-columns:var(--cols)}
.r{display:grid;grid-column:1/-1;grid-template-columns:subgrid;border-top:1px solid var(--grid)}
@supports not (grid-template-columns:subgrid){ .r{grid-template-columns:var(--cols)} }
.rows>.r:first-child{border-top:none}
.r>*{padding:0 6px;height:var(--row);display:flex;align-items:center}
.r:hover,.r.sel{background:var(--accent-soft)}
.r.drag{opacity:.32}
.r.hit{background:#FBF3D6}
.r.hole{background:var(--hole);color:var(--muted)}
.r.hole .nm{font-style:italic;font-size:12px}
.r.up{box-shadow:inset 3px 0 0 var(--up)}
.r.dn{box-shadow:inset 3px 0 0 var(--down)}
.seed{font:400 11px var(--mono);color:var(--muted);justify-content:flex-end;
  padding-right:7px;cursor:grab}
.seed .new{font-style:normal;color:var(--accent);font-weight:500;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase}
.seed .pl{color:var(--ink);font-weight:500}
.fl{padding:0 !important;justify-content:center}
.fl img{width:16px;height:12px;object-fit:cover;display:block;box-shadow:0 0 0 .5px rgba(0,0,0,.28)}
.nm{font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;cursor:grab}
.nm .cap{color:var(--accent);font-weight:600;margin-left:4px}
.nm.warn{color:var(--warn)}
.vl{font:400 11.5px var(--mono);font-variant-numeric:tabular-nums;
  justify-content:flex-end;color:var(--muted);flex-direction:column;align-items:flex-end;
  line-height:1.05}
.vl i{font-style:normal;font-size:9.5px}
.vl i.p{color:var(--up)} .vl i.m{color:var(--down)}
.r.sel .vl,.r:hover .vl{color:var(--ink)}
.mv{grid-column:1/-1;display:none;height:auto !important;padding:3px 6px 4px !important}
.r.sel .mv{display:flex}
.mv select{width:100%;height:22px}
.log{grid-column:1/-1;border-top:1px solid var(--grid);background:var(--hole);
  padding:6px 8px;font:400 11px var(--mono);color:var(--muted);line-height:1.6}
.log b{color:var(--ink);font-weight:500}
.log u{text-decoration:none;color:var(--accent)}
.log .rd{display:block;font:600 9.5px var(--cond);letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:5px 0 1px}

.ch{grid-column:1/-1;position:sticky;top:var(--phead);z-index:2;background:var(--band);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--grid);padding:3px 8px;
  display:flex;align-items:center;font:600 10.5px var(--cond);letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted)}
.ch b{margin-left:auto;font:400 10px var(--mono);letter-spacing:0}
.done{padding:24px 14px;color:var(--muted);font-size:12.5px;line-height:1.5}
.empty{padding:34px 16px;color:var(--muted);font-size:13px;max-width:48ch;line-height:1.55}
.empty b{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .card{transition:box-shadow .12s,border-color .12s} }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">World League</div>
    <div class="tabs" id="branch" role="tablist"></div>
    <div class="ctl" id="scopeWrap" hidden><label for="scope">Scope</label><select id="scope"></select></div>
    <div class="spacer"></div>
    <div class="ctl"><input type="search" id="find" placeholder="Find a team" style="width:150px"></div>
  </div>
  <div class="bar">
    <div class="tabs" id="divs" role="tablist"></div>
    <div class="spacer"></div>
    <div class="ctl" id="drawCtl">
      <button class="btn" id="snake">Seed by strength</button>
      <button class="btn" id="cluster">Cluster by region</button>
      <button class="btn" id="clear">Empty the groups</button>
      <button class="btn go" id="play">Play the season</button>
    </div>
    <div class="ctl" id="resCtl" hidden>
      <button class="btn go" id="next">Set up next season</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>
</header>

<main>
  <aside id="pool" data-g="-1">
    <div class="phead">Unassigned <span id="poolCount"></span></div>
    <div class="rows" id="poolRows"></div>
  </aside>
  <div class="scroller"><div class="board" id="board"></div></div>
</main>

const state = () => (ST[key()] || (ST[key()] = fresh()));
function autoFillSingle(st, d){
  if (st.shape[d].length !== 1 || !st.free[d].length) return;
  st.groups[d][0] = st.groups[d][0].filter(x => x !== null).concat(st.free[d]);
  st.free[d] = [];
}
const bySeed = st => (a, b) => st.seed.get(a) - st.seed.get(b);
const poolSort = st => (a, b) =>
  (CONT_ORDER[TEAM[a].cont] - CONT_ORDER[TEAM[b].cont]) ||
  TEAM[a].country.localeCompare(TEAM[b].country) || st.val.get(b) - st.val.get(a);

/* ═══ draws ══════════════════════════════════════════════════ */
function assignSnake(st, d){
  const sizes = st.shape[d], squad = st.member[d].slice().sort(bySeed(st));
  st.groups[d] = sizes.map(() => []);
  let i = 0, round = 0;
  while (i < squad.length){
    const order = [...sizes.keys()];
    if (round % 2) order.reverse();
    let moved = false;
    for (const g of order){
      if (st.groups[d][g].length < sizes[g] && i < squad.length){
        st.groups[d][g].push(squad[i++]); moved = true;
      }
    }
    if (!moved) break;
    round++;
  }
  st.free[d] = squad.slice(i);
}
function assignCluster(st, d){
  assignSnake(st, d);
  const gs = st.groups[d], depth = Math.max(0, ...gs.map(g => g.length));
  for (let band = 0; band < depth; band++){
    const slots = [], bench = [];
    gs.forEach((g, gi) => { if (g.length > band){ slots.push(gi); bench.push(g[band]); } });
    if (bench.length < 2) continue;
    bench.sort(bySeed(st));
    const taken = new Set();
    for (const id of bench){
      const t = TEAM[id];
      let best = slots.find(g => !taken.has(g)), score = -Infinity;
      for (const gi of slots){
        if (taken.has(gi)) continue;
        let s = 0;
        for (let k = 0; k < band; k++){
          const o = TEAM[gs[gi][k]]; if (!o) continue;
          if (o.country === t.country) s += 3; else if (o.cont === t.cont) s += 1;
        }
        if (s > score){ score = s; best = gi; }
      }
      taken.add(best); gs[best][band] = id;
    }
  }
}
function emptyGroups(st, d){
  st.groups[d] = st.shape[d].map(() => []);
  st.free[d] = st.member[d].slice();
  autoFillSingle(st, d);
}

/* ═══ season ═════════════════════════════════════════════════ */
function simulateSeason(st){
  const roll = rng(st.year * 2654435761 + 12345);
  const before = new Map(st.val);
  const res = st.groups.map((gs, d) => gs.map(g =>
    runGroup(st, g.filter(x => x !== null).sort(bySeed(st)), roll)));

  const demand = st.shape.map(sizes => total(sizes.map(relPer)));
  const D = st.shape.length, up = [], down = [];
  for (let d = 0; d < D; d++){ up.push([]); down.push([]); }
  for (let d = 1; d < D; d++){
    const per = Math.max(1, Math.min(Math.floor(demand[d - 1] / res[d].length),
                                     Math.floor(Math.min(...st.shape[d]) / 2)));
    res[d].forEach(r => up[d].push(...r.order.slice(0, per)));
  }
  for (let d = 0; d < D - 1; d++){
    const pool = [];
    res[d].forEach((r, gi) => r.rel.forEach(id =>
      pool.push({id, place: r.order.indexOf(id), gi})));
    pool.sort((a, b) => b.place - a.place || st.val.get(a.id) - st.val.get(b.id));
    down[d] = pool.slice(0, up[d + 1].length).map(x => x.id);
  }

  const rank = new Map();
  res.forEach((gs, d) => {
    const depth = Math.max(0, ...gs.map(r => r.order.length));
    const flat = [];
    for (let b = 0; b < depth; b++) gs.forEach(r => { if (r.order[b] !== undefined) flat.push(r.order[b]); });
    flat.forEach((id, i) => rank.set(id, {d, p: i + 1}));
  });
  const delta = new Map();
  st.val.forEach((v, id) => delta.set(id, v - (before.get(id) || v)));

  st.result = {res, up, down, rank, year: st.year};
  st.delta = delta;
  return st.result;
}

function rollOver(st){
  const {res, up, down, rank} = st.result;
  const moved = new Map();
  down.forEach((ids, d) => ids.forEach(id => moved.set(id, d + 1)));
  up.forEach((ids, d) => ids.forEach(id => moved.set(id, d - 1)));

  const member = st.member.map(() => []);
  const groups = st.groups.map(gs => gs.map(g => g.map(() => null)));
  const free = st.member.map(() => []);
  st.groups.forEach((gs, d) => gs.forEach((g, gi) => g.forEach((id, si) => {
    if (id === null || moved.has(id)) return;
    groups[d][gi][si] = id; member[d].push(id);
  })));
  st.free.forEach((ids, d) => ids.forEach(id => {
    if (!moved.has(id)){ free[d].push(id); member[d].push(id); }
  }));
  moved.forEach((to, id) => { free[to].push(id); member[to].push(id); });

  st.rank = rank; st.member = member; st.groups = groups; st.free = free;
  st.result = null; st.year++;
  // reseed: last division and placing first, live value as the tiebreak
  const order = [...st.val.keys()].filter(id => rank.has(id) || member.flat().includes(id));
  order.sort((a, b) => {
    const ra = rank.get(a), rb = rank.get(b);
    if (ra && rb) return ra.d - rb.d || ra.p - rb.p;
    if (ra) return -1;
    if (rb) return 1;
    return st.val.get(b) - st.val.get(a);
  });
  order.forEach((id, i) => st.seed.set(id, i + 1));
  st.shape.forEach((_, d) => autoFillSingle(st, d));
}

function reshape(st, cfg){
  const n = st.member.reduce((a, m) => a + m.length, 0);
  const shape = tiers(n, cfg);
  while (st.groups.length < shape.length){ st.groups.push([]); st.member.push([]); st.free.push([]); }
  shape.forEach((sizes, d) => {
    while (st.groups[d].length < sizes.length) st.groups[d].push([]);
    while (st.groups[d].length > sizes.length) st.free[d].push(...st.groups[d].pop().filter(x => x !== null));
    st.groups[d].forEach((g, gi) => {
      while (g.length > sizes[gi]){ const x = g.pop(); if (x !== null) st.free[d].push(x); }
    });
  });
  st.shape = shape;
  for (let d = 0; d < shape.length - 1; d++){
    const over = st.member[d].length - total(shape[d]);
    if (over <= 0) continue;
    const worst = new Set(st.member[d].slice().sort((a, b) => st.seed.get(b) - st.seed.get(a)).slice(0, over));
    st.member[d] = st.member[d].filter(id => !worst.has(id));
    st.free[d] = st.free[d].filter(id => !worst.has(id));
    st.groups[d].forEach(g => g.forEach((x, i) => { if (worst.has(x)) g[i] = null; }));
    st.member[d + 1].push(...worst); st.free[d + 1].push(...worst);
  }
  shape.forEach((_, d) => autoFillSingle(st, d));
}
function expand(){
  const from = LIVE, to = Math.min(TEAM.length, LIVE + WAVE);
  if (to <= from) return 0;
  const added = []; for (let i = from; i < to; i++) added.push(i);
  LIVE = to;
  Object.entries(ST).forEach(([k, st]) => {
    const cut = k.indexOf('|');
    const c = BRANCH[k.slice(0, cut)], scope = k.slice(cut + 1);
    const mine = added.filter(id => inScope(id, c, scope));
    if (!mine.length) return;
    const d = st.shape.length - 1;
    mine.forEach(id => {
      st.seed.set(id, st.seed.size + 1); st.val.set(id, TEAM[id].val);
      st.member[d].push(id); st.free[d].push(id);
    });
    reshape(st, c);
  });
  return added.length;
}

/* ═══ render ═════════════════════════════════════════════════ */
function renderChrome(st){
  $('branch').innerHTML = Object.entries(BRANCH).map(([k, v]) =>
    `<button class="tab" role="tab" data-b="${k}" aria-selected="${k === S.branch}">${v.label}</button>`).join('');
  const c = BRANCH[S.branch];
  $('scopeWrap').hidden = !c.scope;
  if (c.scope) $('scope').innerHTML = scopeList().map(([n]) =>
    `<option ${n === S.scope ? 'selected' : ''}>${n}</option>`).join('');
  $('divs').innerHTML = st.shape.map((g, i) =>
    `<button class="tab" role="tab" data-d="${i}" aria-selected="${i === S.div}">D${i + 1}
      <span style="color:var(--muted);font-family:var(--mono);font-size:10px">${st.member[i].length}</span></button>`).join('');
  const done = !!st.result;
  $('drawCtl').hidden = done; $('resCtl').hidden = !done;
  $('pool').hidden = done;
}
function tag(st, id){
  if (st.result){
    const r = st.result.rank.get(id);
    return r ? `<span class="pl">${r.p}</span>` : '—';
  }
  const r = st.rank.get(id);
  if (r) return `D${r.d + 1}\u00b7${r.p}`;
  return st.year > 1 ? '<i class="new">new</i>' : st.seed.get(id);
}
function valCell(st, id){
  const d = st.result ? (st.delta.get(id) || 0) : 0;
  const sign = d > 0 ? `<i class="p">+${num(d)}</i>` : d < 0 ? `<i class="m">${num(d)}</i>` : '';
  return `<div class="vl">${num(st.val.get(id))}${sign}</div>`;
}
function row(st, id, gi, heavy, cls){
  if (id === null) return `<div class="r hole"><div class="seed">—</div><div class="fl"></div>
    <div class="nm">empty slot</div><div class="vl"></div></div>`;
  const t = TEAM[id];
  const opts = st.result ? '' :
    [`<option value="-1" ${gi === -1 ? 'selected' : ''}>Leave unassigned</option>`]
      .concat((st.groups[S.div] || []).map((_, i) =>
        `<option value="${i}" ${i === gi ? 'selected' : ''}>Move to group ${gLabel(i)}</option>`)).join('');
  return `<div class="r ${cls || ''}" data-t="${id}" ${st.result ? '' : 'draggable="true"'}>
    <div class="seed">${tag(st, id)}</div>
    <div class="fl"><img src="${flag(t.iso)}" alt="${t.country}" title="${t.country}" loading="lazy"></div>
    <div class="nm${heavy ? ' warn' : ''}">${t.name}${t.cap ? '<span class="cap">★</span>' : ''}</div>
    ${valCell(st, id)}
    ${opts ? `<div class="mv"><select data-mv="${id}">${opts}</select></div>` : ''}</div>`;
}
function renderPool(st){
  const free = st.free[S.div] || [];
  $('poolCount').textContent = `${free.length} of ${(st.member[S.div] || []).length}`;
  if (!free.length){
    $('poolRows').innerHTML = `<p class="done">Nothing waiting.<br>Drag a team here to take it out of a group.</p>`;
    return;
  }
  const list = free.slice().sort(poolSort(st));
  const byCont = {};
  list.forEach(id => byCont[TEAM[id].cont] = (byCont[TEAM[id].cont] || 0) + 1);
  let out = '', cont = null;
  list.forEach(id => {
    if (TEAM[id].cont !== cont){ cont = TEAM[id].cont; out += `<div class="ch">${cont}<b>${byCont[cont]}</b></div>`; }
    out += row(st, id, -1, false);
  });
  $('poolRows').innerHTML = out;
}
function matchLog(st, r){
  const nm = id => `<u>${TEAM[id].name}</u>`;
  const label = {bronze:'Bronze game', save:'Relegation play-off'};
  let out = '', last = null;
  r.matches.forEach(m => {
    const head = label[m.round] || `Round ${m.round}`;
    if (head !== last){ out += `<span class="rd">${head}</span>`; last = head; }
    out += `<b>${TEAM[m.winner].name}</b> beat ${nm(m.loser)}` +
      (m.take ? ` <i>+${num(m.take)}</i>` : ' <i>·</i>') + '<br>';
  });
  return `<div class="log">${out}</div>`;
}
function renderBoard(st){
  const sizes = st.shape[S.div] || [], count = st.member[S.div] ? st.member[S.div].length : 0;
  if (!sizes.length){
    $('board').innerHTML = `<p class="empty"><b>${S.scope} has a single team.</b><br>
      It goes to the Small Nations Cup rather than a national pyramid.</p>`;
    $('meta').innerHTML = ''; return;
  }
  if (total(sizes) < 4){
    const rule = count === 1 ? 'It is promoted automatically every year.'
      : count === 2 ? 'Both are promoted automatically every year.'
      : 'The top seed is promoted automatically; the other two play off for the second place.';
    $('board').innerHTML = `<p class="empty"><b>Only ${count} team${count > 1 ? 's' : ''} at this level —
      too few for a group.</b><br>${rule}</p>`;
    $('meta').innerHTML = `<span><b>${count}</b> auto-promoted</span>`;
    return;
  }
  const R = st.result;
  const upSet = R ? new Set(R.up[S.div]) : null;
  const dnSet = R ? new Set(R.down[S.div]) : null;
  let warn = 0;
  $('board').innerHTML = st.groups[S.div].map((g, gi) => {
    const live = g.filter(x => x !== null), tally = {};
    live.forEach(id => tally[TEAM[id].country] = (tally[TEAM[id].country] || 0) + 1);
    const heavy = new Set(Object.entries(tally).filter(([, n]) => n >= 3).map(([c]) => c));
    warn += heavy.size;
    const strip = live.map(id => `<img src="${flag(TEAM[id].iso)}" alt="" loading="lazy"
      title="${TEAM[id].country}" class="${heavy.has(TEAM[id].country) ? 'dup' : ''}">`).join('');
    let body;
    if (R){
      const r = R.res[S.div][gi];
      body = r.order.map(id => row(st, id, gi, heavy.has(TEAM[id].country),
        upSet.has(id) ? 'up' : dnSet.has(id) ? 'dn' : '')).join('') + matchLog(st, r);
    } else {
      const slots = g.slice();
      while (slots.length < sizes[gi]) slots.push(null);
      body = slots.map(id => row(st, id, gi, id !== null && heavy.has(TEAM[id].country))).join('');
    }
    return `<section class="card" data-g="${gi}">
      <div class="head"><span class="gid">${gLabel(gi)}</span>
        <span class="gsize${live.length === sizes[gi] ? ' full' : ''}">${live.length}/${sizes[gi]}</span>
        <span class="strip">${strip}</span></div>
      <div class="rows">${body}</div></section>`;
  }).join('');
  const m = R ? total(R.res[S.div].map(r => r.matches.length)) : 0;
  $('meta').innerHTML = `<span>year <b>${st.year}</b> \u00b7 <b>${LIVE}</b> teams</span>
    <span><b>${sizes.length}</b> groups</span>` +
    (R ? `<span><b>${m}</b> matches</span>
          <span><b>${R.up[S.div].length}</b>&#9650; <b>${R.down[S.div].length}</b>&#9660;</span>`
       : `<span><b>${count - (st.free[S.div] || []).length}</b>/${count} placed</span>
          <span class="${warn ? 'hot' : ''}">${warn ? `<b>${warn}</b> stacked` : 'no stacking'}</span>`);
}
function draw(){ const st = state(); renderChrome(st); if (!st.result) renderPool(st); renderBoard(st); }

/* ═══ moves ══════════════════════════════════════════════════ */
function move(id, to){
  const st = state(); if (st.result) return;
  const gs = st.groups[S.div];
  let from = -1, fromSlot = -1;
  gs.forEach((g, gi) => g.forEach((x, si) => { if (x === id){ from = gi; fromSlot = si; } }));
  if (from === to) return;
  if (from >= 0) gs[from][fromSlot] = null;
  else st.free[S.div].splice(st.free[S.div].indexOf(id), 1);
  if (to === -1) st.free[S.div].push(id);
  else {
    const size = st.shape[S.div][to];
    let slot = gs[to].indexOf(null);
    if (slot === -1 && gs[to].length < size){ gs[to].push(null); slot = gs[to].length - 1; }
    if (slot === -1){
      slot = 0; const bumped = gs[to][0];
      if (from >= 0) gs[from][fromSlot] = bumped; else st.free[S.div].push(bumped);
    }
    gs[to][slot] = id;
  }
  draw();
}

/* ═══ wiring ═════════════════════════════════════════════════ */
$('branch').onclick = e => {
  const b = e.target.closest('[data-b]'); if (!b) return;
  S.branch = b.dataset.b; S.div = 0;
  S.scope = BRANCH[S.branch].scope ? scopeList()[0][0] : null;
  draw();
};
$('scope').onchange = e => { S.scope = e.target.value; S.div = 0; draw(); };
$('divs').onclick = e => {
  const b = e.target.closest('[data-d]'); if (!b) return;
  S.div = +b.dataset.d; draw();
};
$('snake').onclick   = () => { assignSnake(state(), S.div); draw(); };
$('cluster').onclick = () => { assignCluster(state(), S.div); draw(); };
$('clear').onclick   = () => { emptyGroups(state(), S.div); draw(); };
$('play').onclick = () => {
  const st = state();
  const pending = st.free.findIndex((f, d) => f.length && st.shape[d].length > 1);
  if (pending >= 0){
    S.div = pending; draw();
    alert(`D${pending + 1} still has ${st.free[pending].length} team(s) waiting.`);
    return;
  }
  simulateSeason(st); draw();
};
$('next').onclick = () => { const st = state(); rollOver(st); expand(); draw(); };

let dragId = null;
document.addEventListener('dragstart', e => {
  const r = e.target.closest('.r[data-t][draggable]'); if (!r) return;
  dragId = +r.dataset.t; r.classList.add('drag');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragId));
});
document.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.drag,.over').forEach(n => n.classList.remove('drag', 'over'));
});
document.addEventListener('dragover', e => {
  if (dragId === null) return;
  const z = e.target.closest('.card,#pool'); if (!z) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.over').forEach(n => n.classList.remove('over'));
  z.classList.add('over');
});
document.addEventListener('drop', e => {
  if (dragId === null) return;
  const z = e.target.closest('.card,#pool'); if (!z) return;
  e.preventDefault(); move(dragId, +z.dataset.g);
});
document.addEventListener('click', e => {
  const r = e.target.closest('.r[data-t]');
  document.querySelectorAll('.r.sel').forEach(n => n.classList.remove('sel'));
  if (r && !e.target.closest('select')) r.classList.add('sel');
});
document.addEventListener('change', e => {
  if (e.target.dataset.mv) move(+e.target.dataset.mv, +e.target.value);
});
$('find').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.r[data-t]').forEach(r => {
    const t = TEAM[+r.dataset.t];
    r.classList.toggle('hit', !!q && (t.name.toLowerCase().includes(q) ||
      t.country.toLowerCase().includes(q)));
  });
  const first = document.querySelector('.r.hit');
  if (first) first.scrollIntoView({block:'center', behavior:'smooth'});
};

draw();
</script>
